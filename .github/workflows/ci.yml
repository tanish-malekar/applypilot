name: POC checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q -m 'not browser'
      - run: python scripts/evaluate.py
      - run: python -m playwright install --with-deps chromium
      - name: Browser integration
        run: |
          uvicorn job_agents.api:app --host 127.0.0.1 --port 8000 > /tmp/job-agents-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          RUN_BROWSER_TESTS=1 pytest tests/test_browser.py -q
