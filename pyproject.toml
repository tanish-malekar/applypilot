[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "job-application-agents"
version = "0.1.0"
description = "Stateful computer-use job application research POC"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1,<2", "langchain-groq>=1,<2", "langchain-ollama>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "playwright>=1.50,<2", "httpx>=0.28,<1", "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
job-agents = "job_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["job_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches local Chromium against the sandbox"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
